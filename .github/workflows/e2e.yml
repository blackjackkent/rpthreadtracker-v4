name: E2E Tests

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${{ secrets.CI_DB_PASSWORD }} -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P "${{ secrets.CI_DB_PASSWORD }}" -C \
            -Q "CREATE DATABASE RPThreadTracker_Test"

      - name: Push schema to test database
        env:
          DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
        run: npx prisma db push --skip-generate

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          # Resend — use a fake key; email flows aren't tested in E2E
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: noreply@example.com
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
