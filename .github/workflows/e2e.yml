name: E2E Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CI_DB_URL: "sqlserver://localhost:1433;database=RPThreadTracker_Test;user=sa;password=CiTestPassword123!;trustServerCertificate=true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: CiTestPassword123!
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 1433 2>/dev/null; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done
          echo "SQL Server did not start in time"
          exit 1

      - name: Create test database
        run: npx prisma db push --force-reset
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=RPThreadTracker_Test;user=sa;password=CiTestPassword123!;trustServerCertificate=true;encrypt=true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: ${{ env.CI_DB_URL }}
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: noreply@example.com
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
