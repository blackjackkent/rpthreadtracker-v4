name: E2E Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CI_DB_PASSWORD: "CiTestPassword123!"
  CI_DB_URL: "sqlserver://localhost:1433;database=RPThreadTracker_Test;user=sa;password=CiTestPassword123!;trustServerCertificate=true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: CiTestPassword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "cat /dev/null > /dev/tcp/127.0.0.1/1433 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          sudo add-apt-repository "$(curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list)"
          sudo apt-get update
          sudo apt-get install -y mssql-tools18 unixodbc-dev

      - name: Create test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P "$CI_DB_PASSWORD" -C \
            -Q "CREATE DATABASE RPThreadTracker_Test"

      - name: Push schema to test database
        env:
          DATABASE_URL: ${{ env.CI_DB_URL }}
        run: npx prisma db push --skip-generate

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: ${{ env.CI_DB_URL }}
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: noreply@example.com
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
